# Production stack (TASK-012): web (nginx, static build) + api (Express/Node) + db
# (PostgreSQL). `make setup` / `scripts/setup.sh` drive this. Host ports default to
# the values documented in README.md/DEPLOYMENT.md (8080/3000/5432) but are
# overridable via .env (WEB_PORT/API_PORT/DB_PORT) for machines where those are
# already taken. DB_USER/DB_PASSWORD identify the migration/bootstrap owner;
# running services use separate runtime roles.
#
# API_DATABASE_URL / WORKER_DATABASE_URL point the running services at explicit
# non-superuser roles. The older DATABASE_URL variable remains a compatibility
# fallback for an already-provisioned external database. If none is set, the
# runtime URLs use the bundled roles created from DB_API_* / DB_WORKER_*.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp_dev_password}
      POSTGRES_DB: erp
      DB_API_USER: ${DB_API_USER:-erp_api}
      DB_API_PASSWORD: ${DB_API_PASSWORD:-erp_api_dev_password}
      DB_WORKER_USER: ${DB_WORKER_USER:-erp_worker}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:-erp_worker_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
      - ./deploy/sql/runtime-roles.sql:/opt/erp/runtime-roles.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp} -d erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${API_DATABASE_URL:-${DATABASE_URL:-postgresql://${DB_API_USER:-erp_api}:${DB_API_PASSWORD:-erp_api_dev_password}@db:5432/erp}}
      PORT: 3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ERP_RELEASE_COMMIT: ${ERP_RELEASE_COMMIT:-unknown}
      ERP_TOKEN_ENCRYPTION_KEY: ${ERP_TOKEN_ENCRYPTION_KEY:-}
      ERP_PUBLIC_URL: ${ERP_PUBLIC_URL:-http://localhost:8080}
      DOCUMENT_STORAGE_FS_ROOT: ${DOCUMENT_STORAGE_FS_ROOT:-}
    volumes:
      - document_storage:/var/lib/erp-documents
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["email"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: ${WORKER_DATABASE_URL:-${DATABASE_URL:-postgresql://${DB_WORKER_USER:-erp_worker}:${DB_WORKER_PASSWORD:-erp_worker_dev_password}@db:5432/erp}}
      ERP_TOKEN_ENCRYPTION_KEY: ${ERP_TOKEN_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-5000}
      CALENDAR_OUTBOUND_URL: ${CALENDAR_OUTBOUND_URL:-}
      CALENDAR_OUTBOUND_TOKEN: ${CALENDAR_OUTBOUND_TOKEN:-}
      CALENDAR_OUTBOUND_TIMEOUT_MS: ${CALENDAR_OUTBOUND_TIMEOUT_MS:-15000}
      DOCUMENT_STORAGE_FS_ROOT: ${DOCUMENT_STORAGE_FS_ROOT:-}
    volumes:
      - document_storage:/var/lib/erp-documents
    depends_on:
      db:
        condition: service_healthy

  calendar-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "worker:calendar"]
    environment:
      DATABASE_URL: ${WORKER_DATABASE_URL:-${DATABASE_URL:-postgresql://${DB_WORKER_USER:-erp_worker}:${DB_WORKER_PASSWORD:-erp_worker_dev_password}@db:5432/erp}}
      CALENDAR_WORKER_ID: ${CALENDAR_WORKER_ID:-erp-calendar-worker}
      CALENDAR_POLL_MS: ${CALENDAR_POLL_MS:-15000}
      CALENDAR_OUTBOUND_TIMEOUT_MS: ${CALENDAR_OUTBOUND_TIMEOUT_MS:-15000}
      CALENDAR_OUTBOUND_URL: ${CALENDAR_OUTBOUND_URL:-}
      CALENDAR_OUTBOUND_TOKEN: ${CALENDAR_OUTBOUND_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  migrator:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL:-postgresql://${DB_USER:-erp}:${DB_PASSWORD:-erp_dev_password}@db:5432/erp}}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      # Context = repo root, not web/ alone — see web/Dockerfile for why.
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_DATA_MODE: api
        VITE_PLATFORM_DEMO_AUTOFILL: ${VITE_PLATFORM_DEMO_AUTOFILL:-false}
        ERP_RELEASE_COMMIT: ${ERP_RELEASE_COMMIT:-unknown}
        ERP_RELEASE_DATA_MODE: api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  document_storage:
