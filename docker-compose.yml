# Production stack (TASK-012): web (nginx, static build) + api (Express/Node) + db
# (PostgreSQL). `make setup` / `scripts/setup.sh` drive this. Host ports default to
# the values documented in README.md/DEPLOYMENT.md (8080/3000/5432) but are
# overridable via .env (WEB_PORT/API_PORT/DB_PORT) for machines where those are
# already taken. DB_USER/DB_PASSWORD default to a placeholder for the one-command
# `make setup` promise — override DB_PASSWORD in .env before any real deployment.
#
# DATABASE_URL (api/worker): if set in .env, it is used as-is — this is how
# `scripts/setup.sh --interactive` points at an already-provisioned external
# database (RDS/Cloud SQL/Supabase/etc). Unset, it falls back to the bundled
# `db` service built from DB_USER/DB_PASSWORD above (TASK-060, EPIC-025).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp_dev_password}
      POSTGRES_DB: erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp} -d erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-erp}:${DB_PASSWORD:-erp_dev_password}@db:5432/erp}
      PORT: 3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ERP_SETUP_TOKEN: ${ERP_SETUP_TOKEN:-}
      ERP_TOKEN_ENCRYPTION_KEY: ${ERP_TOKEN_ENCRYPTION_KEY:-}
      ERP_PUBLIC_URL: ${ERP_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["email"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-erp}:${DB_PASSWORD:-erp_dev_password}@db:5432/erp}
      ERP_TOKEN_ENCRYPTION_KEY: ${ERP_TOKEN_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-5000}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      # Context = repo root, not web/ alone — see web/Dockerfile for why.
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_DATA_MODE: api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
