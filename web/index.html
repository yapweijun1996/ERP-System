<!-- TASK-019 data-mode seam: %VITE_DATA_MODE% is substituted by Vite from the
     VITE_DATA_MODE env var (unset in a plain `vite build` leaves the literal
     placeholder text, which the adapters below treat as "demo"). 'demo' loads
     erp-system-data-adapter.js (PGlite/IndexedDB); 'api' loads
     erp-system-api-adapter.js (HTTP to the production API). Both expose the
     same window.ErpSystemData resource contract. -->
<script>
  window.__ERP_DATA_MODE__='%VITE_DATA_MODE%';
  window.erpDataMode=function(){ return window.__ERP_DATA_MODE__==='api' ? 'api' : 'demo'; };
  window.ErpDemoRuntimeReady=new Promise(function(resolve,reject){
    window.__resolveErpDemoRuntime=resolve;
    window.__rejectErpDemoRuntime=reject;
  });
</script>
<script type="module" src="/src/erp-demo-runtime.ts"></script>
