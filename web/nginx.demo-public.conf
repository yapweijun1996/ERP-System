# Public demo gateway for the existing Cloudflare Tunnel route.
# cloudflared retains /erp; this proxy removes that mount exactly once before
# forwarding to the static Demo container, whose asset URLs are relative.
server {
  listen 80;
  server_name _;

  location = /erp {
    absolute_redirect off;
    return 308 /erp/;
  }

  location ^~ /erp/ {
    proxy_pass http://host.docker.internal:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /erp;
  }
}
