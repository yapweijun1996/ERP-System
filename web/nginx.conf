# Same-origin reverse proxy to the api service — this is why
# erp-system-api-adapter.js's API_BASE defaults to a relative '/api': the browser
# never needs CORS because /health and /api/* are proxied by nginx to the api
# container over the Docker Compose network, not fetched cross-origin.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /health {
    proxy_pass http://api:3000/health;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
