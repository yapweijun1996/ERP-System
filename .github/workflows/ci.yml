name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Vitest shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run Vitest shard
        run: npm test -- --shard=${{ matrix.shard }} --reporter=dot

  validate:
    name: Typecheck, transaction proof, and demo build
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Lint (src/, web/src/, web/public/assets/, scripts/)
        run: npm run lint

      - name: Typecheck root (src/, includes the API server and drizzle config)
        run: npm run typecheck

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Check generated PGlite artifacts
        run: npm run check:demo-schema

      - name: Check schema drift (all Drizzle migrations vs generated PGlite schema)
        run: npm run check:drift

      - name: Check application permission registry and route contracts
        run: npm run check:permissions

      - name: PostgreSQL 16 non-superuser security lifecycle proof
        env:
          POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_ci
        run: npm run test:postgres

      - name: Run transaction proof on PGlite AND PostgreSQL (cross-engine parity + true concurrency)
        env:
          POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_ci
        run: npm run demo

      - name: Build the GitHub Pages demo bundle
        env:
          VITE_DATA_MODE: demo
        run: npm run build:demo

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package.json').devDependencies.playwright)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (+ OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: i18n browser matrix (en/ms/zh/ja/vi × desktop/mobile)
        env:
          I18N_LANGUAGES: en,ms,zh,ja,vi
          I18N_REQUIRE_PGLITE: 1
          I18N_BOOT_TIMEOUT_MS: 60000
          I18N_PAGE_BOOT_TIMEOUT_MS: 120000
          I18N_ROUTE_TIMEOUT_MS: 20000
        run: |
          mkdir -p output
          set -euo pipefail
          run_i18n() {
            local viewport="$1"
            local port="$2"
            I18N_VIEWPORTS="$viewport" \
              I18N_AUDIT_PORT="$port" \
              I18N_REPORT_PATH="output/i18n-browser-report-${viewport}.json" \
              npm run audit:i18n >"output/i18n-browser-${viewport}.log" 2>&1
          }
          run_i18n desktop 4312 & desktop_pid=$!
          run_i18n mobile 4313 & mobile_pid=$!
          desktop_status=0
          mobile_status=0
          wait "$desktop_pid" || desktop_status=$?
          wait "$mobile_pid" || mobile_status=$?
          if [[ "$desktop_status" -ne 0 || "$mobile_status" -ne 0 ]]; then
            cat output/i18n-browser-desktop.log output/i18n-browser-mobile.log
            exit 1
          fi

      - name: Upload i18n browser matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-browser-matrix
          path: output/i18n-browser-report-*.json
          if-no-files-found: ignore

      - name: Browser smoke test (desktop + mobile, zero console/page errors)
        run: npm run smoke

      - name: Screen audit (every SCREENS route, zero errors + no leftover prototype data on canonical screens)
        run: npm run audit:screens

      - name: Transaction list layout audit (declared SSOT routes, desktop + mobile)
        run: npm run audit:list-layouts

      - name: Operational workspace layout audit (declared SSOT routes, desktop + mobile)
        run: npm run audit:workspaces
