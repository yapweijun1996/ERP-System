name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, transaction proof, and demo build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Typecheck root (src/, includes the API server and drizzle config)
        run: npm run typecheck

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Check generated PGlite artifacts
        run: npm run check:demo-schema

      - name: Check schema drift (all Drizzle migrations vs generated PGlite schema)
        run: npm run check:drift

      - name: Run unit tests (confirmOrder, issueStock, effective-dated tax)
        run: npm test

      - name: PostgreSQL 16 non-superuser security lifecycle proof
        env:
          POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_ci
        run: npm run test:postgres

      - name: Run transaction proof on PGlite AND PostgreSQL (cross-engine parity + true concurrency)
        env:
          POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_ci
        run: npm run demo

      - name: Build the GitHub Pages demo bundle
        env:
          VITE_DATA_MODE: demo
        run: npm run build:demo

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package.json').devDependencies.playwright)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (+ OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Browser smoke test (desktop + mobile, zero console/page errors)
        run: npm run smoke

      - name: Screen audit (every SCREENS route, zero errors + no leftover prototype data on canonical screens)
        run: npm run audit:screens
